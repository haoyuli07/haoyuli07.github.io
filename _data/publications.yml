# Publications, NEWEST FIRST (labels are numbered from this order).
#
#   type      conference | workshop | journal | under_review
#             -> label prefix C | W | J | U (set in _config.yml, pub_labels).
#             Numbers count within each type, oldest = 1, so a paper keeps
#             its label as new ones are added. When an under-review paper
#             is accepted, change its type and it moves to C/W/J.
#   selected  true  -> shows under "Selected" (and "All")
#             false -> shows only under "All"
#   preview   3:2 image in assets/publication_preview/
#
# `links` is an ordered list; drop any you don't have.
# BibTeX record of truth stays in _bibliography/papers.bib.

