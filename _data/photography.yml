# Photography gallery, newest first. Photos are laid out in justified rows that
# alternate 2 and 3 photos per row; every photo keeps its original aspect
# ratio (never cropped). Hovering one reveals its location and date.
#
# Add a photo: drop the file in assets/img/photography/, then add an entry.
# width/height are the image's pixel size; they set its shape in the row.
#
#   - src: /assets/img/photography/your-file.jpg
#     width: 2000
#     height: 1333
#     location: "Place Name"
#     date: "Month YYYY"
#     alt: A short description of what's in the photo

- src: /assets/img/photography/ridge.jpg
